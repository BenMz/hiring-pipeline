version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    paths:
      - gen/

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - gen/
