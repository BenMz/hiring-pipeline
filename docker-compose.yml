name: hiring-pipeline

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092" # Kafka API for clients on the host
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot job that creates the event store topic. Events are the source of
  # truth, so retention is infinite and the topic is NOT compacted (compaction
  # would drop all but the latest event per application ID).
  create-topics:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        rpk -X brokers=redpanda:9092 topic describe applications.events >/dev/null 2>&1 ||
        rpk -X brokers=redpanda:9092 topic create applications.events
        --partitions 6 --replicas 1
        --topic-config retention.ms=-1
        --topic-config cleanup.policy=delete
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline-command:
    build:
      context: .
      dockerfile: services/command/Dockerfile
    environment:
      KAFKA_BROKERS: redpanda:9092
      EVENTS_TOPIC: applications.events
      GRPC_ADDR: ":50051"
    ports:
      - "50051:50051"
    depends_on:
      create-topics:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
