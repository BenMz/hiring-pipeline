name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  proto:
    name: Protobuf (lint, format, breaking, codegen up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: true
          # Compares against the PR's base branch, or the previous commit on
          # a push. Label a PR "buf skip breaking" for an intentional break.
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          push: false
      - name: Generated code matches the protos
        run: |
          buf generate
          git diff --exit-code -- gen/ services/notifier/src/gen/ || {
            echo "::error::Generated code is stale. Run 'make generate' and commit the result."
            exit 1
          }

  go:
    name: Go (lint, unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Unit tests
        run: go test -race -count=1 ./...

  integration:
    name: Integration (Testcontainers + Redpanda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Integration tests
        run: go test -tags=integration -race -count=1 ./...
